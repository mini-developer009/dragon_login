<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dragon Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            user-select: none; /* Prevent text selection while clicking to play music */
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.5)); 
        }

        /* ===========================
           RUNNING GRADIENT BORDER
        =========================== */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 400px;
            padding: 4px; 
            border-radius: 16px;
            background: transparent; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* The Border Animation */
        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(
                45deg, 
                #00ffff, 
                #0000ff, 
                #ffb7b2, 
                #00ffff
            );
            background-size: 300% 300%;
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1; 
            animation: borderFlow 4s ease infinite;
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.5));
        }
        
        .card-content {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 14px; 
            padding: 40px 40px; 
            height: 100%;
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===========================
           SYNCHRONIZED TEXT GRADIENT
        =========================== */
        .glass-card h3 {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 30px;
            
            /* Exact same gradient as border */
            background: linear-gradient(
                45deg, 
                #00ffff, 
                #0000ff, 
                #ffb7b2, 
                #00ffff
            );
            background-size: 300% 300%;
            
            /* Clip background to text */
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Exact same animation as border */
            animation: borderFlow 4s ease infinite;
            
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.3));
        }

        /* ===========================
           ANGRY CYBER BEAR CSS
        =========================== */
        .bear-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid #ff0055; 
            border-radius: 12px;
            margin: 0 auto 20px auto;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            overflow: visible; 
        }

        .bear-face {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .b-ear {
            position: absolute;
            top: -8px;
            width: 24px;
            height: 24px;
            background: #1a1a2e;
            border: 2px solid #ff0055;
            border-radius: 50%;
            z-index: 0;
        }
        .b-ear.left { left: -4px; }
        .b-ear.right { right: -4px; }

        .b-brow {
            position: absolute;
            top: 22px;
            width: 22px;
            height: 5px;
            background: #ff0055;
            z-index: 5;
            border-radius: 2px;
            box-shadow: 0 0 5px #ff0055;
        }
        .b-brow.left { left: 14px; transform: rotate(25deg); }
        .b-brow.right { right: 14px; transform: rotate(-25deg); }

        .b-eye {
            position: absolute;
            top: 32px;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            z-index: 2;
            transition: all 0.2s ease;
            overflow: hidden;
        }
        .b-eye.left { left: 18px; }
        .b-eye.right { right: 18px; }

        .b-pupil {
            width: 6px;
            height: 6px;
            background: #000;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .b-snout {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 22px;
            background: #0f0f1a;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 2;
        }
        .b-nose {
            width: 12px; height: 8px;
            background: #ff0055;
            border-radius: 6px;
            margin: 5px auto 0;
        }

        /* --- STATE: EYES CLOSED --- */
        .bear-box.closing .b-eye {
            height: 2px; 
            border-radius: 0;
            top: 38px; 
            background: #ff0055; 
            box-shadow: 0 0 5px #ff0055;
        }
        .bear-box.closing .b-pupil {
            display: none;
        }

        /* ===========================
           REST OF FORM STYLES
        =========================== */
        .form-control {
            background: rgba(0, 0, 0, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff !important;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }
        
        .form-control:focus {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-neon {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
            border-radius: 8px;
            z-index: 1;
        }

        .btn-neon::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, #00ffff, #0000ff, #ffb7b2);
            z-index: -1;
            transition: transform 0.4s ease;
            transform: translateX(-100%);
        }

        .btn-neon:hover::before {
            transform: translateX(0);
        }
        
        .btn-neon:hover {
            border-color: transparent;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
        }

        .seal {
            position: absolute;
            top: -30px;
            right: -20px;
            width: 60px;
            height: 60px;
            background: #000;
            border: 2px solid #00ffff;
            color: #00ffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 0 15px #00ffff;
            z-index: 20;
            overflow: hidden; /* Ensures the image stays circular */
        }

        /* New rule to make the icon fit perfectly */
        .seal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Music Info Toast */
        #musicInfo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            z-index: 100;
            pointer-events: none;
            font-family: monospace;
        }
        #musicInfo.show {
            opacity: 1;
            transform: translateY(0);
        }
        /* Pulse animation for the click-to-play prompt */
        @keyframes pulse-text {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .click-prompt {
            animation: pulse-text 2s infinite;
            color: #ff0055;
        }
    </style>
</head>
<body>

    <canvas id="dragonCanvas"></canvas>

    <!-- Music Notification -->
    <div id="musicInfo" class="show click-prompt">🎵 Click anywhere to start Cyber Audio</div>

    <div class="glass-card">
        <!-- Updated Seal with Icon -->
        <div class="seal">
            <img src="https://www.google.com/s2/favicons?domain=mini-developer.com&sz=128" alt="Logo">
        </div>
        <div class="card-content">
            
            <!-- THE ANGRY BEAR BOX -->
            <div class="bear-box" id="bearBox">
                <div class="bear-face">
                    <div class="b-ear left"></div>
                    <div class="b-ear right"></div>
                    <div class="b-brow left"></div>
                    <div class="b-brow right"></div>
                    <div class="b-eye left"><div class="b-pupil"></div></div>
                    <div class="b-eye right"><div class="b-pupil"></div></div>
                    <div class="b-snout">
                        <div class="b-nose"></div>
                    </div>
                </div>
            </div>

            <h3>Cyber Gate</h3>
            <form>
                <div class="mb-3">
                    <label class="form-label">Net ID</label>
                    <input type="text" class="form-control bear-trigger">
                </div>
                <div>
                    <label class="form-label">Access Key</label>
                    <input type="password" class="form-control bear-trigger">
                </div>
                <button type="button" class="btn btn-neon">Initialize</button>
            </form>
        </div>
    </div>

    <script>
        // ===========================
        // GENERATIVE CYBER MUSIC (WEB AUDIO API)
        // ===========================
        // This uses code to synthesize sound, so no external files are needed.
        // It also randomizes the "Mood" every time you run it.

        let audioCtx;
        let isPlaying = false;
        const musicToast = document.getElementById('musicInfo');

        // Randomize Key (Base Frequency)
        // Pentatonic Scale notes relative to base
        const scaleOffsets = [0, 3, 5, 7, 10]; 
        const baseFreq = 110 + Math.random() * 100; // Random low note (A2-ish)

        function initAudio() {
            if (isPlaying) return;
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // 1. Background Drone (Deep Sci-Fi Hum)
            createDrone(baseFreq / 2); // Octave lower

            // 2. Procedural Arpeggiator (The "Melody")
            setInterval(() => playRandomNote(), 400); // Play a note every 400ms

            isPlaying = true;
            
            // Update Toast
            musicToast.textContent = "🎵 Generating Cyber Audio...";
            musicToast.classList.remove('click-prompt');
            musicToast.style.color = "#00ffff";
            
            // Hide toast after 3s
            setTimeout(() => {
                musicToast.classList.remove('show');
            }, 3000);
        }

        function createDrone(freq) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth'; // Gritty cyber sound
            osc.frequency.value = freq;
            
            filter.type = 'lowpass';
            filter.frequency.value = 200; // Muffle it so it's background only

            gain.gain.value = 0.05; // Very quiet

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
        }

        function playRandomNote() {
            // Pick random note from scale
            const offset = scaleOffsets[Math.floor(Math.random() * scaleOffsets.length)];
            // Random Octave (0 or 1)
            const octave = Math.random() > 0.5 ? 1 : 0;
            // Calculate Frequency: f = base * 2^(offset/12)
            const noteFreq = baseFreq * Math.pow(2, (offset + octave*12) / 12);

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.value = noteFreq;

            // Envelope (Fade in/out)
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.1, now + 0.05); // Attack
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5); // Decay

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.6);
        }

        // Browser Requirement: User must interact to start AudioContext
        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('keydown', initAudio, { once: true });


        // ===========================
        // BEAR LOGIC
        // ===========================
        const bearBox = document.getElementById('bearBox');
        const triggers = document.querySelectorAll('.bear-trigger');

        triggers.forEach(input => {
            input.addEventListener('focus', () => {
                bearBox.classList.add('closing');
            });
            input.addEventListener('blur', () => {
                bearBox.classList.remove('closing');
            });
        });


        // ===========================
        // DRAGON LOGIC
        // ===========================
        const canvas = document.getElementById('dragonCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouse = { x: 0, y: 0 };
        let tick = 0; 
        
        const SEGMENT_COUNT = 60; 
        const SEGMENT_DIST = 12;  
        const DRAGON_SIZE = 22;   

        let body = [];
        let particles = [];
        let legs = []; 

        function init() {
            resize();
            for (let i = 0; i < SEGMENT_COUNT; i++) {
                body.push({ x: width/2, y: height/2 + i * SEGMENT_DIST });
            }
            const legIndices = [10, 40];
            legIndices.forEach(idx => {
                legs.push({ index: idx, side: -1, x: 0, y: 0 }); 
                legs.push({ index: idx, side: 1, x: 0, y: 0 });  
            });
            for(let i=0; i<50; i++) {
                particles.push({
                    x: Math.random()*width,
                    y: Math.random()*height,
                    size: Math.random()*2,
                    speedY: Math.random()*1 - 0.5,
                    speedX: Math.random()*1 - 0.5,
                    baseHue: Math.random() * 360
                });
            }
            mouse.x = width / 2;
            mouse.y = height / 2;
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function update() {
            tick += 2; 

            let head = body[0];
            const dx = mouse.x - head.x;
            const dy = mouse.y - head.y;
            head.x += dx * 0.08;
            head.y += dy * 0.08;

            for (let i = 1; i < body.length; i++) {
                let curr = body[i];
                let prev = body[i-1];
                let dist_x = curr.x - prev.x;
                let dist_y = curr.y - prev.y;
                let dist = Math.sqrt(dist_x*dist_x + dist_y*dist_y); 
                const dragFactor = (dist - SEGMENT_DIST) / dist;
                curr.x -= dist_x * dragFactor;
                curr.y -= dist_y * dragFactor;
            }

            legs.forEach(leg => {
                const attachPoint = body[leg.index];
                const prevPoint = body[leg.index - 1] || attachPoint;
                const angle = Math.atan2(attachPoint.y - prevPoint.y, attachPoint.x - prevPoint.x);
                const offsetDist = 35;
                const targetX = attachPoint.x + Math.cos(angle + (Math.PI/2 * leg.side)) * offsetDist;
                const targetY = attachPoint.y + Math.sin(angle + (Math.PI/2 * leg.side)) * offsetDist;
                leg.x += (targetX - leg.x) * 0.12;
                leg.y += (targetY - leg.y) * 0.12;
            });

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if(p.x > width) p.x = 0;
                if(p.x < 0) p.x = width;
                if(p.y > height) p.y = 0;
                if(p.y < 0) p.y = height;
            });
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach((p, i) => {
                let hue = (p.baseHue + tick * 0.5) % 360; 
                ctx.fillStyle = `hsla(${hue}, 100%, 70%, 0.5)`;
                ctx.shadowBlur = 5;
                ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            });

            ctx.shadowBlur = 0;
            let headHue = tick % 360;

            legs.forEach(leg => {
                const attach = body[leg.index];
                ctx.strokeStyle = `hsla(${headHue}, 100%, 50%, 0.75)`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(attach.x, attach.y);
                ctx.quadraticCurveTo(
                    (attach.x + leg.x)/2, (attach.y + leg.y)/2 - 10, 
                    leg.x, leg.y
                );
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(leg.x, leg.y, 6, 0, Math.PI*2);
                ctx.fillStyle = `hsla(${headHue}, 100%, 80%, 0.75)`;
                ctx.fill();
            });

            for (let i = body.length - 1; i >= 0; i--) {
                let p = body[i];
                let pPrev = body[i-1] || p;
                let radius = DRAGON_SIZE * (1 - (i / body.length));
                if (radius < 4) radius = 4;

                let hue = (tick + (body.length - i) * 5) % 360;
                let angle = Math.atan2(p.y - pPrev.y, p.x - pPrev.x);

                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.75)`; 
                ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.75)`;
                ctx.shadowBlur = 15;
                ctx.fill();

                ctx.fillStyle = `hsla(${hue}, 100%, 80%, 0.5)`;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, radius * 0.6, radius * 0.6, angle, 0, Math.PI*2);
                ctx.fill();

                if (i > 0 && i % 2 === 0) {
                    let spineAngle = angle - Math.PI/2; 
                    let spineLen = radius * 1.6;
                    let tipX = p.x + Math.cos(spineAngle) * spineLen;
                    let tipY = p.y + Math.sin(spineAngle) * spineLen;
                    let baseX1 = p.x + Math.cos(angle) * (radius * 0.5);
                    let baseY1 = p.y + Math.sin(angle) * (radius * 0.5);
                    let baseX2 = p.x - Math.cos(angle) * (radius * 0.5);
                    let baseY2 = p.y - Math.sin(angle) * (radius * 0.5);

                    ctx.beginPath();
                    ctx.moveTo(baseX1, baseY1);
                    ctx.lineTo(tipX, tipY);
                    ctx.lineTo(baseX2, baseY2);
                    ctx.fillStyle = `hsla(${hue}, 100%, 70%, 0.75)`;
                    ctx.fill();
                }
            }

            drawHead(headHue);
        }

        function drawHead(baseHue) {
            let head = body[0];
            let neck = body[4];
            let angle = Math.atan2(head.y - neck.y, head.x - neck.x);

            ctx.save();
            ctx.translate(head.x, head.y);
            ctx.rotate(angle);
            
            ctx.shadowBlur = 25;
            ctx.shadowColor = `hsla(${baseHue}, 100%, 50%, 0.8)`;

            ctx.fillStyle = `hsla(${baseHue}, 20%, 10%, 0.9)`; 
            ctx.strokeStyle = `hsla(${baseHue}, 100%, 60%, 1)`;
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.moveTo(-15, -15);
            ctx.lineTo(20, -10);
            ctx.lineTo(35, 0);
            ctx.lineTo(20, 15);
            ctx.lineTo(-15, 15);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.moveTo(20, 5);
            ctx.lineTo(25, 0);
            ctx.lineTo(30, 5);
            ctx.fill();

            let antlerHue = (baseHue + 180) % 360;
            ctx.strokeStyle = `hsla(${antlerHue}, 100%, 60%, 1)`;
            ctx.lineWidth = 3;
            
            ctx.beginPath();
            ctx.moveTo(-10, -10);
            ctx.lineTo(-25, -45);
            ctx.lineTo(-15, -55); 
            ctx.moveTo(-25, -45);
            ctx.lineTo(-35, -50); 
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(-10, 10);
            ctx.lineTo(-25, 45);
            ctx.lineTo(-15, 55);
            ctx.moveTo(-25, 45);
            ctx.lineTo(-35, 50); 
            ctx.stroke();

            ctx.shadowColor = "#fff";
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.moveTo(0, -8);
            ctx.lineTo(8, -5);
            ctx.lineTo(0, -2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(0, 8);
            ctx.lineTo(8, 5);
            ctx.lineTo(0, 2);
            ctx.fill();

            ctx.strokeStyle = `hsla(${baseHue}, 100%, 80%, 0.8)`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(30, -5);
            ctx.bezierCurveTo(50, -20, 60, -50, 90 + Math.cos(Date.now()/300)*10, -40);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(30, 5);
            ctx.bezierCurveTo(50, 20, 60, 50, 90 + Math.cos(Date.now()/300+1)*10, 40);
            ctx.stroke();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
